[package]
name = "arz_axum_for_services"
version = "0.1.0"
edition = "2024"
default-run = "arz_axum_for_services"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
clickhouse = { version = "0.14.1" , features= ["native-tls"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
futures = "0.3.31"
neo4rs = "0.6.2"
nanoid = "0.4"
chrono = { version = "0.4.42", features = ["serde"] }
thiserror = "2.0.17"

bs58 = "0.5"
sha2 = "0.10"
hex = "0.4"
once_cell = "1.21.3"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
debug = true
