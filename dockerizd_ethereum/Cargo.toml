[package]
name = "ethereum_aml"
version = "0.1.0"
edition = "2024"
default-run = "ethereum_ingestor"

[dependencies]
alloy = { version = "=1.8.3", default-features = false, features = [
    "std",
    "provider-http",
    "provider-debug-api",
    "reqwest-rustls-tls",
    "rpc-types",
] }
anyhow = "1.0.100"
axum = "0.8.7"
clap = { version = "4.5.54", features = ["derive"] }
clickhouse = "=0.14.1"
csv = "1.4.0"
neo4rs = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[profile.dev]
debug = true
opt-level = 0

[profile.release]
debug = true
lto = "thin"
