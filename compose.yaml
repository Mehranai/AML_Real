name: aml-whole

services:
  gateway:
    image: aml-whole-gateway:local
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${AML_BIND_ADDRESS:-127.0.0.1}:${AML_PORT:-8080}:8080"
    environment:
      AML_TRON_UPSTREAM: ${AML_TRON_UPSTREAM:-http://host.docker.internal:4001}
      AML_ETHEREUM_UPSTREAM: ${AML_ETHEREUM_UPSTREAM:-http://host.docker.internal:5001}
      AML_SERVICE_KEY: ${AML_SERVICE_KEY:-}
      AML_BASIC_AUTH_REALM: ${AML_BASIC_AUTH_REALM:-off}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_ENVSUBST_FILTER: ^AML_((TRON|ETHEREUM)_UPSTREAM|SERVICE_KEY|BASIC_AUTH_REALM)$$
    volumes:
      - "${AML_HTPASSWD_FILE:-./gateway/auth/disabled.htpasswd}:/etc/nginx/auth/htpasswd:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s
