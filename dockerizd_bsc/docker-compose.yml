x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-bsc-schema-environment: &bsc-schema-environment
  BSC_CLICKHOUSE_URL: http://clickhouse:8123
  BSC_CLICKHOUSE_USER: ${BSC_CLICKHOUSE_USER:-bsc_admin}
  BSC_CLICKHOUSE_PASSWORD: ${BSC_CLICKHOUSE_PASSWORD:?Set BSC_CLICKHOUSE_PASSWORD in .env}
  BSC_CLICKHOUSE_DATABASE: bsc_aml
  RUST_LOG: ${RUST_LOG:-info}
  RUST_BACKTRACE: ${RUST_BACKTRACE:-1}
  TZ: ${TZ:-UTC}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8.16.16@sha256:512bb8a214831bfb66e0fd51368c10c13ed319a50fa0d3864f88c01c0e8295fe
    restart: unless-stopped
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${BSC_CLICKHOUSE_HTTP_PORT:-38123}:8123"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${BSC_CLICKHOUSE_NATIVE_PORT:-39000}:9000"
    environment:
      CLICKHOUSE_USER: ${BSC_CLICKHOUSE_USER:-bsc_admin}
      CLICKHOUSE_PASSWORD: ${BSC_CLICKHOUSE_PASSWORD:?Set BSC_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - bsc_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(clickhouse-client
          --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1")" = "1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - bsc-backend
    logging: *json-logging

  bsc-schema:
    image: bsc-aml-service:${BSC_APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bsc_schema"]
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment: *bsc-schema-environment
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - bsc-backend
    logging: *json-logging

  bsc-ingest:
    image: bsc-aml-service:${BSC_APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    command: ["bsc_ingest"]
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment: &bsc-runtime-environment
      <<: *bsc-schema-environment
      BSC_MODE: ${BSC_MODE:-development}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      BSC_RPC_FALLBACK_URLS: ${BSC_RPC_FALLBACK_URLS:-}
      BSC_RPC_PROVIDER: ${BSC_RPC_PROVIDER:-custom}
      BSC_RPC_TIMEOUT_SECONDS: ${BSC_RPC_TIMEOUT_SECONDS:-15}
      BSC_TRACE_MODE: ${BSC_TRACE_MODE:-auto}
      BSC_REQUIRE_BLOCK_RECEIPTS: ${BSC_REQUIRE_BLOCK_RECEIPTS:-false}
      BSC_TRACE_PROBE_BLOCK: ${BSC_TRACE_PROBE_BLOCK:-0}
      BSC_RECEIPT_FETCH_MODE: ${BSC_RECEIPT_FETCH_MODE:-auto}
      BSC_BLOCK_FETCH_CONCURRENCY: ${BSC_BLOCK_FETCH_CONCURRENCY:-8}
      BSC_RECEIPT_CONCURRENCY: ${BSC_RECEIPT_CONCURRENCY:-8}
      BSC_RPC_MAX_ATTEMPTS: ${BSC_RPC_MAX_ATTEMPTS:-4}
      BSC_RPC_RETRY_BASE_MILLIS: ${BSC_RPC_RETRY_BASE_MILLIS:-250}
      BSC_RPC_MAX_RESPONSE_BYTES: ${BSC_RPC_MAX_RESPONSE_BYTES:-67108864}
      BSC_INGEST_MAX_BLOCKS_PER_RUN: ${BSC_INGEST_MAX_BLOCKS_PER_RUN:-1000}
      BSC_SYNC_MODE: ${BSC_SYNC_MODE:-auto}
      BSC_INGEST_BATCH_SIZE: ${BSC_INGEST_BATCH_SIZE:-100}
      BSC_POLL_INTERVAL_SECONDS: ${BSC_POLL_INTERVAL_SECONDS:-3}
      BSC_RPC_REQUEST_DELAY_MILLIS: ${BSC_RPC_REQUEST_DELAY_MILLIS:-0}
      BSC_REORG_MAX_DEPTH: ${BSC_REORG_MAX_DEPTH:-128}
      BSC_FAILURE_MAX_ATTEMPTS: ${BSC_FAILURE_MAX_ATTEMPTS:-10}
      BSC_REPAIR_MAX_BLOCKS: ${BSC_REPAIR_MAX_BLOCKS:-1000}
      BSC_PROTOCOL_REGISTRY_REFRESH_BLOCKS: ${BSC_PROTOCOL_REGISTRY_REFRESH_BLOCKS:-1000}
      BSC_INGEST_START_BLOCK: ${BSC_INGEST_START_BLOCK:-}
      BSC_INGEST_END_BLOCK: ${BSC_INGEST_END_BLOCK:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      bsc-schema:
        condition: service_completed_successfully
    networks:
      - bsc-backend
    logging: *json-logging

  bsc-follow:
    image: bsc-aml-service:${BSC_APP_IMAGE_TAG:-local}
    profiles: ["runtime"]
    command: ["bsc_ingest", "--mode", "follow"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment: *bsc-runtime-environment
    depends_on:
      clickhouse:
        condition: service_healthy
      bsc-schema:
        condition: service_completed_successfully
    networks:
      - bsc-backend
    logging: *json-logging

  bsc-replay:
    image: bsc-aml-service:${BSC_APP_IMAGE_TAG:-local}
    profiles: ["tools"]
    command: ["bsc_replay", "--help"]
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment: *bsc-runtime-environment
    depends_on:
      bsc-schema:
        condition: service_completed_successfully
    networks: ["bsc-backend"]
    logging: *json-logging

  bsc-repair:
    image: bsc-aml-service:${BSC_APP_IMAGE_TAG:-local}
    profiles: ["tools"]
    command: ["bsc_repair", "--help"]
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment: *bsc-runtime-environment
    depends_on:
      bsc-schema:
        condition: service_completed_successfully
    networks: ["bsc-backend"]
    logging: *json-logging

  bsc-benchmark:
    image: bsc-aml-service:${BSC_APP_IMAGE_TAG:-local}
    profiles: ["tools"]
    command: ["bsc_benchmark", "--help"]
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment: *bsc-runtime-environment
    depends_on:
      bsc-schema:
        condition: service_completed_successfully
    networks: ["bsc-backend"]
    logging: *json-logging

  bsc-import-protocols:
    image: bsc-aml-service:${BSC_APP_IMAGE_TAG:-local}
    profiles: ["tools"]
    command: ["bsc_import_protocols", "--help"]
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment: *bsc-schema-environment
    depends_on:
      bsc-schema:
        condition: service_completed_successfully
    networks: ["bsc-backend"]
    logging: *json-logging

volumes:
  bsc_clickhouse_data:

networks:
  bsc-backend:
    driver: bridge
