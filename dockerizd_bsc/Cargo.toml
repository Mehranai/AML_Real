[package]
name = "bsc_aml"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
default-run = "bsc_rpc_probe"

[dependencies]
clickhouse = "=0.14.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[dev-dependencies]
axum = "0.8.9"

[profile.release]
debug = true
lto = "thin"
