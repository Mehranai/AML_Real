openapi: 3.1.0
info:
  title: AML Chain Adapter API
  version: 1.0.0
  description: >-
    Contract between the main AML gateway and an isolated blockchain VM. A chain VM owns its
    node/RPC access, ingestion workers and an isolated ClickHouse database. The main VM
    owns the Analytical Node and central Neo4j. The gateway never connects to ClickHouse directly.
servers:
  - url: http://chain-api.internal
security:
  - ServiceKey: []
paths:
  /api/bitcoin/ingestion/failures:
    get:
      operationId: listBitcoinIngestionFailures
      description: Latest persisted operational failure state in the Bitcoin VM. Read-only; does not trigger repair or assert data freshness.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [retry, dead_letter, repairing, gap, resolved] }
        - name: from_block
          in: query
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
        - name: to_block
          in: query
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
        - name: after_block
          in: query
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Failure rows ordered by block_number; next_after_block is null when no more rows remain. Concurrent operational changes may affect subsequent pages.
          content:
            application/json:
              schema:
                type: object
                required: [network_id, failures, truncated, next_after_block, scope]
                properties:
                  network_id: { type: string }
                  failures:
                    type: array
                    items: { type: object, additionalProperties: true }
                  truncated: { type: boolean }
                  next_after_block: { type: [integer, "null"] }
                  scope: { type: string, const: latest_persisted_failure_state }
        "400": { description: Invalid status, range or limit. }
        "401": { description: Missing or invalid service key. }
        "503": { description: Persisted failure state unavailable. }
  /health:
    get:
      security: []
      operationId: liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      security: []
      operationId: readiness
      responses:
        "200":
          description: Required chain-local dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more required dependencies are unavailable.
  /api/{network}/wallet/{address}/investigation:
    get:
      operationId: investigateWallet
      description: Read-only wallet investigation assembled from persisted chain-local evidence.
      parameters:
        - $ref: "#/components/parameters/Network"
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Investigation result. Chain-specific evidence fields may be added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "400": { description: Invalid network address or options. }
        "401": { description: Missing or invalid service key. }
  /api/{network}/wallet/{address}/neo4j/import:
    post:
      operationId: projectWalletGraph
      description: Legacy projection endpoint; main gateway returns 410. Export the central investigation by its ID instead.
      parameters:
        - $ref: "#/components/parameters/Network"
        - $ref: "#/components/parameters/Address"
      responses:
        "200": { description: Projection result. }
        "400": { description: Invalid network address or options. }
        "401": { description: Missing or invalid service key. }
  /api/{network}/wallet/{source}/paths/{target}:
    get:
      operationId: findWalletPaths
      description: Read-only path search over persisted transfers, bounded to at most 10 hops.
      parameters:
        - $ref: "#/components/parameters/Network"
        - name: source
          in: path
          required: true
          schema: { type: string }
        - name: target
          in: path
          required: true
          schema: { type: string }
        - name: max_hops
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
      responses:
        "200": { description: Bounded path-search result. }
        "400": { description: Invalid address or path options. }
        "401": { description: Missing or invalid service key. }
components:
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-AML-Service-Key
  parameters:
    Network:
      name: network
      in: path
      required: true
      schema:
        type: string
        enum: [tron, ethereum, bsc, bitcoin]
    Address:
      name: address
      in: path
      required: true
      schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
      additionalProperties: true
    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        dependencies:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    Investigation:
      type: object
      required: [api_version, network_id, address, graph]
      properties:
        api_version: { type: string, const: "1.0" }
        network_id: { type: string }
        address: { type: string }
        graph: { type: object, additionalProperties: true }
        data_quality: { type: object, additionalProperties: true }
        data_coverage: { type: object, additionalProperties: true }
      additionalProperties: true
