worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Investigation addresses and query strings are deliberately excluded.
    log_format operational '$remote_addr $request_method $status $request_time';
    access_log /dev/stdout operational;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    limit_req_zone $binary_remote_addr zone=aml_api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=aml_connections:10m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /tmp/default.conf;
}
