<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AML Whole | Wallet Investigation</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">AML <strong>Whole</strong></a>
    <span class="workspace-name">Investigation workspace</span>
  </header>
  <main>
    <section aria-labelledby="investigation-title" class="investigation">
      <div class="section-heading"><h1 id="investigation-title">Wallet investigation</h1><span class="environment">Mainnet</span></div>
      <form id="investigation-form" novalidate>
        <div class="field"><label for="network">Network</label><select id="network" name="network" required></select></div>
        <div class="field wallet-field"><label for="address">Wallet address</label><input id="address" name="address" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="address-error"></div>
        <button class="primary" type="submit"><img src="/assets/search.svg" alt="" width="18" height="18">Investigate</button>
        <p id="address-error" class="error" role="alert"></p>
      </form>
    </section>
    <section class="networks" aria-labelledby="networks-title">
      <div class="section-heading"><h2 id="networks-title">Networks</h2><button id="refresh" class="icon-button" type="button" title="Refresh network status" aria-label="Refresh network status"><img src="/assets/refresh-cw.svg" alt="" width="19" height="19"></button></div>
      <div class="network-head" aria-hidden="true"><span>Network</span><span>ClickHouse</span><span>Neo4j</span><span>API</span><span></span></div>
      <div id="network-list" aria-live="polite" aria-busy="true"></div>
    </section>
  </main>
  <footer><span>AML Whole</span><span id="last-checked">Checking connections</span></footer>
</body>
</html>
